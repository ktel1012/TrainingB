<!DOCTYPE html>
<html>
<head>
    <title>Icon Generator</title>
</head>
<body>
    <h1>TrainingB Icon Generator</h1>
    <p>Open this file in browser and save the generated images</p>
    
    <h2>Icon 192x192</h2>
    <canvas id="icon192" width="192" height="192"></canvas>
    <br>
    <button onclick="download('icon192', 'icon-192.png')">Download 192x192</button>
    
    <h2>Icon 512x512</h2>
    <canvas id="icon512" width="512" height="512"></canvas>
    <br>
    <button onclick="download('icon512', 'icon-512.png')">Download 512x512</button>
    
    <script>
        function createIcon(canvasId, size) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            
            // Gradient background
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#667eea');
            gradient.addColorStop(1, '#764ba2');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);
            
            // Draw "TB" text
            ctx.fillStyle = 'white';
            ctx.font = `bold ${size * 0.4}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('TB', size / 2, size / 2);
            
            // Draw circle around
            ctx.strokeStyle = 'white';
            ctx.lineWidth = size * 0.05;
            ctx.beginPath();
            ctx.arc(size / 2, size / 2, size * 0.4, 0, 2 * Math.PI);
            ctx.stroke();
        }
        
        function download(canvasId, filename) {
            const canvas = document.getElementById(canvasId);
            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL();
            link.click();
        }
        
        // Generate icons on load
        window.onload = function() {
            createIcon('icon192', 192);
            createIcon('icon512', 512);
        };
    </script>
</body>
</html>
