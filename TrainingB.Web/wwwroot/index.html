<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="description" content="TrainingB Lottery Scraper - Web & Mobile">
    <meta name="theme-color" content="#2196F3">
    <title>TrainingB Scraper</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    
    <!-- Icons -->
    <link rel="icon" type="image/png" href="/icon-192.png">
    <link rel="apple-touch-icon" href="/icon-512.png">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .status {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }
        
        .status.loading { background: #fff3cd; color: #856404; }
        .status.success { background: #d4edda; color: #155724; }
        .status.error { background: #f8d7da; color: #721c24; }
        
        .scraper-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .scraper-btn {
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .scraper-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .scraper-btn:active {
            transform: translateY(0);
        }
        
        .scraper-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .run-all-btn {
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            margin-bottom: 20px;
            font-size: 18px;
        }
        
        .results {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            white-space: pre-wrap;
            user-select: text;
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
        }

        .copy-btn {
            width: 100%;
            padding: 12px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .copy-btn:hover {
            background: #1976D2;
        }

        .copy-btn:active {
            background: #0D47A1;
        }
        
        .install-btn {
            width: 100%;
            padding: 15px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            display: none;
        }
        
        .install-btn:hover {
            background: #45a049;
        }

        /* Confirmation Dialog */
        .dialog-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .dialog-overlay.active {
            display: flex;
        }

        .dialog-box {
            background: white;
            border-radius: 15px;
            padding: 25px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .dialog-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }

        .dialog-message {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .dialog-buttons {
            display: flex;
            gap: 10px;
        }

        .dialog-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .dialog-btn.confirm {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .dialog-btn.confirm:active {
            transform: scale(0.95);
        }

        .dialog-btn.cancel {
            background: #e0e0e0;
            color: #333;
        }

        .dialog-btn.cancel:active {
            transform: scale(0.95);
        }

        @media (max-width: 600px) {
            .container { padding: 20px; }
            h1 { font-size: 24px; }
            .scraper-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎰 TrainingB Scraper</h1>
        <p class="subtitle">Web & Mobile Lottery Data Scraper</p>
        
        <button class="install-btn" id="installBtn">📱 Cài đặt App</button>
        
        <div id="status" class="status" style="display:none;"></div>
        
        <button class="scraper-btn run-all-btn" onclick="confirmRunAll()">
            🚀 Chạy Tất Cả Scrapers
        </button>

        <a href="/daoso.html" style="text-decoration: none;">
            <button class="scraper-btn run-all-btn" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); margin-bottom: 20px;">
                🔢 Đảo Số
            </button>
        </a>

        <div class="scraper-grid" id="scraperGrid"></div>

        <div class="results" id="results">Chưa có kết quả...</div>
        <button class="copy-btn" onclick="copyResults()">📋 Copy Kết Quả</button>
    </div>

    <!-- Confirmation Dialog -->
    <div class="dialog-overlay" id="confirmDialog">
        <div class="dialog-box">
            <div class="dialog-title" id="dialogTitle">Xác nhận</div>
            <div class="dialog-message" id="dialogMessage"></div>
            <div class="dialog-buttons">
                <button class="dialog-btn cancel" onclick="cancelDialog()">❌ Hủy</button>
                <button class="dialog-btn confirm" onclick="confirmDialog()">✅ Chạy</button>
            </div>
        </div>
    </div>

    <script src="/app.js?v=7"></script>
</body>
</html>
